services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: study_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    env_file:
     - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
     - db
volumes:
  pgdata:
